<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Controller Mapper</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --primary: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      width: 380px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }
    .title {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-badge {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 999px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-connected {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .status-disconnected {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    .bumper-select-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      background: var(--card);
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .select-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .select-group label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
    }
    .select-group select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 12px;
      outline: none;
    }
    .profile-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }
    .profile-btn {
      flex: 1;
      padding: 8px;
      font-size: 12px;
      font-weight: 600;
      background: var(--card);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .profile-btn.active {
      background: var(--primary);
      color: #0f172a;
      border-color: var(--primary);
    }
    .section-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin: 12px 0 8px 0;
      font-weight: 700;
    }
    .mapping-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 240px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .mapping-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card);
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .mapping-label {
      font-size: 13px;
      font-weight: 600;
    }
    .mapping-desc {
      font-size: 11px;
      color: var(--text-muted);
    }
    .key-badge {
      background: #334155;
      color: #e2e8f0;
      padding: 4px 10px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid #475569;
      cursor: pointer;
    }
    .key-badge:hover {
      border-color: var(--primary);
    }
    .footer-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .btn {
      flex: 1;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }
    .btn-save {
      background: var(--primary);
      color: #0f172a;
    }
    .btn-reset {
      background: transparent;
      color: #f87171;
      border: 1px solid #7f1d1d;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">🎮 Controller Mapper</div>
    <div id="controllerStatus" class="status-badge status-disconnected">
      <span id="statusIcon">●</span> <span id="statusText">Disconnected</span>
    </div>
  </div>

  <!-- Dynamic Bumper Actions (Profile 1 only) -->
  <div id="bumperSelectContainer" class="bumper-select-bar">
    <div class="select-group">
      <label for="lbSelect">LB Action:</label>
      <select id="lbSelect">
        <option value="DEFAULT">Default (LB)</option>
        <option value="LEFT_CLICK">Left Mouse Click</option>
        <option value="RIGHT_CLICK">Right Mouse Click</option>
      </select>
    </div>
    <div class="select-group">
      <label for="rbSelect">RB Action:</label>
      <select id="rbSelect">
        <option value="DEFAULT">Default (RB)</option>
        <option value="LEFT_CLICK">Left Mouse Click</option>
        <option value="RIGHT_CLICK">Right Mouse Click</option>
      </select>
    </div>
  </div>

  <div class="profile-bar">
    <button class="profile-btn active" data-profile="profile1">Profile 1 (3D Games)</button>
    <button class="profile-btn" data-profile="profile2">Profile 2 (Soccer)</button>
  </div>

  <div class="section-title">Key Mappings (Click button to rebind)</div>

  <div id="mappingsContainer" class="mapping-list">
    <!-- Populated dynamically by popup.js -->
  </div>

  <div class="footer-actions">
    <button id="resetBtn" class="btn btn-reset">Reset Preset</button>
    <button id="saveBtn" class="btn btn-save">Save Profile</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
